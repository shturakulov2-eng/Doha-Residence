  <title>DOHA turar-joy majmuasi — 200 ta xonadon uchun CHEGIRMA</title>
  <meta name="description" content="Samarqand shahri Sat-tepo massividan uy xarid qiling va sovg'asiga 1 ta xonadon va 2 ta KIA SONET avtomobillaridan birini qo'lga kiriting!" />
  <meta property="og:title" content="DOHA turar-joy majmuasi" />
  <meta property="og:description" content="200 ta xonadon uchun CHEGIRMAga yoziling!" />

  <link rel="icon" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />

<body>
  <div class="bg" aria-hidden="true">
    <span class="glow glow--1"></span>
    <span class="glow glow--2"></span>
  </div>

  <main class="screen">
    <header class="header reveal" style="--d: 0ms">
      <img class="logo" src="/assets/logo.png" alt="DOHA turar-joy majmuasi" width="1024" height="691" />
    </header>

    <section class="hero reveal" style="--d: 120ms">
      <p class="hero__text">
        <b>SAT-TEPO’DAN UY OLING&nbsp;—</b><br />
        SOVG‘AGA <span class="accent">XONADON</span> YOKI <span class="accent">KIA&nbsp;SONET!</span>
      </p>
      <p class="hero__sub">
        2&nbsp;TA&nbsp;KIA&nbsp;SONET VA 1&nbsp;TA&nbsp;XONADON&nbsp;— SIZNI&nbsp;KUTMOQDA!
      </p>
    </section>

    <section class="card reveal" style="--d: 240ms">
      <div class="car car--left" aria-hidden="true">
        <img src="/assets/kia-sonet.webp" alt="" width="480" height="285" />
        <span class="car__flare car__flare--main"></span>
        <span class="car__flare car__flare--side"></span>
      </div>
      <div class="car car--right" aria-hidden="true">
        <img src="/assets/kia-sonet.webp" alt="" width="480" height="285" />
        <span class="car__flare car__flare--main"></span>
        <span class="car__flare car__flare--side"></span>
      </div>
      <div class="badge"><span class="badge__dot"></span>Cheklangan taklif</div>
      <h1 class="card__title">
        200 TA XONADON UCHUN MAXSUS <span class="accent">CHEGIRMA!</span>
        <span class="card__subtitle">Chegirmaga ega bo‘lish uchun ismingiz va telefon raqamingizni qoldiring!</span>
      </h1>

      <form class="form" id="leadForm" novalidate>
        <label class="field" id="nameField">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2.2c-4.1 0-8 2-8 4.9V21h16v-1.9c0-2.9-3.9-4.9-8-4.9Z"/></svg>
          </span>
          <input type="text" name="name" id="name" placeholder="Ismingizni kiriting" autocomplete="given-name" maxlength="40" required />
        </label>

        <label class="field" id="phoneField">
          <span class="field__prefix">+998</span>
          <input type="tel" name="phone" id="phone" placeholder="99 999 99 99" inputmode="numeric" autocomplete="tel-national" required />
        </label>

        <button type="submit" class="btn" id="submitBtn">
          <span class="btn__label">CHEGIRMAGA YOZILISH</span>
          <span class="btn__spinner" aria-hidden="true"></span>
        </button>
      </form>
    </section>

  </main>

  <script src="/js/main.js"></script>
</body>
</html>
